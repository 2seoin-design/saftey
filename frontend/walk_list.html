<body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen">

            <div class="flex items-center gap-space-xs">
              <div class="w-9 h-9 rounded-full bg-secondary-container/40 flex items-center justify-center text-secondary">
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">verified_user</span>
              </div>
              <div class="flex flex-col">
                <h2 class="font-title-sm text-title-sm text-on-surface"><span id="walkUserName">회원</span>님의 안심 보행</h2>
              </div>
            </div>
            <button aria-label="도움말" class="text-on-surface-variant hover:text-secondary transition-colors p-1" type="button"></button>
          </div>
          <!-- Stats Grid (3 Columns) -->
          <div class="grid grid-cols-3 gap-space-xs bg-surface-container-low rounded-lg p-space-xs">
            <div class="flex flex-col items-center justify-center py-space-xs bg-surface-container-lowest rounded-lg shadow-sm">

            </div>
            <div class="flex flex-col items-center justify-center py-space-xs bg-surface-container-lowest rounded-lg shadow-sm">
              <span class="font-label-sm text-label-sm text-on-surface-variant">획득 리워드</span>
              <span id="walkStatReward" class="font-headline-md text-headline-md text-primary mt-0.5">-<span class="font-label-sm text-label-sm text-primary ml-0.5">P</span></span>
            </div>
          </div>
        </div>

        <!-- History List Stream -->
        <div class="flex flex-col gap-space-sm mt-1" id="walkHistoryList">
          <div class="text-center py-10 text-on-surface-variant font-label-md text-label-md" id="walkHistoryStatus">불러오는 중...</div>
        </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../backend/data/supabaseClient.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const COURSE_DISTANCE_KM = { '마름모': 0.67, '하트': 1.33, '별': 2.0, '기하학적 물고기': 4.0, '왕관': 6.0 };
      const COURSE_ICON = { '마름모': 'diamond.png', '하트': 'heart.png', '별': 'star.png', '기하학적 물고기': 'fish.png', '왕관': 'gueen.png' };
      const REWARD_PER_COMPLETION = 200;

      const nameEl = document.getElementById('walkUserName');
      const countEl = document.getElementById('walkStatCount');
      const distanceEl = document.getElementById('walkStatDistance');
      const rewardEl = document.getElementById('walkStatReward');
      const listEl = document.getElementById('walkHistoryList');
      const statusEl = document.getElementById('walkHistoryStatus');

      const session = await getFreshSession();
      if (!session) {
        location.href = 'login.html';
        return;
      }

      if (nameEl) nameEl.textContent = session.user.user_metadata?.name || session.user.email || '회원';

      function formatDateTime(iso) {
        const d = new Date(iso);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function renderCard(completion) {
        const distanceKm = COURSE_DISTANCE_KM[completion.courseName];
        const icon = COURSE_ICON[completion.courseName];
        const article = document.createElement('article');
        article.className = 'flex flex-col rounded-xl bg-surface-container-lowest p-space-md shadow-sm hover:shadow-md transition-shadow gap-space-xs';
        article.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm">
              <span class="material-symbols-outlined text-[14px]">schedule</span>
              <span>${formatDateTime(completion.completedAt)}</span>
            </div>
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-secondary-container/30 text-on-secondary-container font-label-sm text-label-sm">
              <span class="material-symbols-outlined text-[14px] text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
              성공 완료
            </span>
          </div>
          <div class="flex flex-col gap-1 mt-0.5">
            <div class="flex items-center gap-2">
              ${icon ? `<img src="../img/${icon}" alt="${completion.courseName}모양 아이콘" class="w-6 h-6 object-contain shrink-0">` : ''}
              <h3 class="font-title-sm text-title-sm text-on-surface">${completion.courseName}모양 산책로</h3>
            </div>
            <p class="font-body-md text-body-md text-on-surface-variant flex items-center flex-wrap gap-x-2 gap-y-0.5">
              ${distanceKm ? `<span class="font-semibold text-on-surface">${distanceKm} km</span><span class="text-outline-variant">·</span>` : ''}
              ${completion.rewardGranted ? `<span class="font-semibold text-primary">${completion.rewardLabel}</span>` : '<span>리워드 없음(당일 중복 완주)</span>'}
            </p>
          </div>
        `;
        return article;
      }

      try {
        const res = await fetch('/api/mypage/completions', {
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (!res.ok) throw new Error(`완주 내역 조회 실패: ${res.status}`);
        const { completions } = await res.json();

        const totalCount = completions.length;
        const totalDistanceKm = completions.reduce((sum, c) => sum + (COURSE_DISTANCE_KM[c.courseName] ?? 0), 0);
        const totalReward = completions.filter((c) => c.rewardGranted).length * REWARD_PER_COMPLETION;

        if (countEl) countEl.firstChild.textContent = String(totalCount);
        if (distanceEl) distanceEl.firstChild.textContent = totalDistanceKm.toFixed(1);
        if (rewardEl) rewardEl.firstChild.textContent = totalReward.toLocaleString();

        if (statusEl) statusEl.remove();
        if (totalCount === 0) {
          const empty = document.createElement('div');
          empty.className = 'text-center py-10 text-on-surface-variant font-label-md text-label-md';
          empty.textContent = '아직 완주한 안심 산책로가 없어요. 안전지도에서 산책로를 시작해보세요!';
          listEl.appendChild(empty);
        } else {
          completions.forEach((completion) => listEl.appendChild(renderCard(completion)));
        }
      } catch (err) {
        console.error('완주 내역을 불러오지 못했습니다:', err);
        if (statusEl) statusEl.textContent = '완주 내역을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
        if (countEl) countEl.firstChild.textContent = '0';
        if (distanceEl) distanceEl.firstChild.textContent = '0.0';
        if (rewardEl) rewardEl.firstChild.textContent = '0';
      }
    });
  </script>
