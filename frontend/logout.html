      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

    body.page-transition.page-loaded { opacity: 1; }

<body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen page-transition" style="background-color: #F8FBED;">
<!-- TOP HEADER (메인 홈화면과 동일) -->
<header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,0,0,0.04)]">
  <div class="relative h-16 px-gutter-mobile flex items-center justify-between gap-space-xs">

    <!-- 왼쪽: 로고 이미지 + 로고 텍스트 -->
    <a href="index.html" class="flex items-center gap-2" aria-label="홈으로 이동">
      <img src="../img/safety_logo_image.png" alt="안전디딤돌 로고" class="h-12 w-auto object-contain">
      <img src="../img/safety_logo_text.png" alt="안전디딤돌 로고 텍스트" class="h-6 w-auto object-contain">
    </a>

  </div>
</header>

<!-- MAIN BODY CONTENT (로그아웃 확인 & 안내 카드) -->
<main class="flex-1 flex flex-col relative w-full pt-20 pb-24 px-gutter-mobile min-h-screen" style="background-color: #F8FBED;">
<!-- 아이콘 & 로고 엠블럼 -->
<div class="flex flex-col items-center text-center mb-4">

<h1 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight mb-1.5">로그아웃하시겠습니까?</h1>

</div>
<!-- 프로필 부분 (마이페이지와 동일) -->
<div class="relative w-full rounded-[28px] p-space-md overflow-hidden mb-5" style="background: linear-gradient(145deg, #eaf8dc 0%, #cdeeb0 45%, #a9dd8e 100%); box-shadow: 0 16px 32px -10px rgba(90,150,50,0.35), inset 0 2px 3px rgba(255,255,255,0.7), inset 0 -6px 10px rgba(70,120,35,0.18);">

  <!-- Ambient Decorative Circles -->
  <div class="absolute -right-10 -top-10 w-36 h-36 rounded-full pointer-events-none" style="background: radial-gradient(circle at 32% 28%, #eaf8dc 0%, #bfe6a0 55%, #8fca6c 100%); box-shadow: inset -8px -8px 14px rgba(60,110,25,0.35), inset 6px 6px 10px rgba(255,255,255,0.6);"></div>
  <div class="absolute right-6 bottom-4 w-9 h-9 rounded-md rotate-45 pointer-events-none" style="background: linear-gradient(145deg, #dff2c8, #a9dd8e); box-shadow: inset -3px -3px 5px rgba(60,110,25,0.3), inset 2px 2px 4px rgba(255,255,255,0.6);"></div>

  <!-- Identity Header -->
  <div class="flex items-center gap-space-sm relative z-10">
    <div class="relative flex-shrink-0">
      <div class="w-20 h-20 rounded-full overflow-hidden shadow-sm bg-surface-container-lowest p-0.5 flex items-center justify-center">
        <span id="profile-avatar-icon" class="material-symbols-outlined text-outline text-[52px]">account_circle</span>
        <img id="profile-avatar" class="hidden w-full h-full rounded-full object-cover" alt="프로필 사진">
      </div>
    </div>

    <div class="flex flex-col min-w-0 flex-1">
      <!-- Monthly Report Stat -->
      <div class="flex flex-col">
        <span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap">제보내역</span>
        <span id="myReportCount" class="font-headline-md text-headline-md font-bold text-on-surface mt-0.5 whitespace-nowrap">-<span class="font-label-md text-label-md font-normal ml-0.5">건</span></span>
      </div>

      <!-- Divider -->
      <div class="border-t border-black/10 my-space-xs"></div>

      <!-- Username + 프로필 수정 버튼 -->
      <div class="flex items-center justify-between gap-1.5">
        <span id="profile-name" class="font-title-sm text-title-sm font-bold text-on-surface truncate">user1234</span>
      </div>
    </div>
  </div>

  <!-- Reward Points Container -->
  <div class="mt-space-sm p-space-xs rounded-xl relative z-10" style="background: linear-gradient(160deg, #ffffff 0%, #f3fbe9 100%); box-shadow: 0 10px 18px -6px rgba(60,110,25,0.3), inset 0 1px 1px rgba(255,255,255,0.9);">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1 text-on-surface-variant">
        <span class="material-symbols-outlined text-[14px]" style="color: rgb(79, 169, 18); font-variation-settings: &quot;FILL&quot; 1;">stars</span>
        <span class="font-label-sm text-label-sm tracking-wide">보유 리워드 포인트</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span id="userPointText" class="font-title-sm text-title-sm font-bold tracking-tight text-on-surface">-</span>
        <span class="font-label-sm text-label-sm font-bold" style="color: rgb(79, 169, 18);">P</span>

    </div>

</div>

<!-- 액션 버튼들 -->
<div class="space-y-3 mb-6">

<!-- 취소 / 홈으로 돌아가기 버튼 -->

<span class="material-symbols-outlined text-[18px]">close</span>
<span class="">취소하고 계속 이용하기</span>

    <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="10report.html">
      <span class="material-symbols-outlined text-[22px]">photo_camera</span>
      <span class="font-label-sm text-[11px]">10초제보</span>
    </a>
    <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="safymap.html">
      <span class="material-symbols-outlined text-[22px]">map</span>
      <span class="font-label-sm text-[11px]">안전지도</span>
    </a>
    <div class="flex-1 flex flex-col items-center relative -top-3">
      <a aria-current="page" class="w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95" href="index.html" style="background: linear-gradient(135deg, rgb(96,194,25) 0%, rgb(79,169,18) 100%);">
        <span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">home</span>
      </a>
      <span class="font-label-sm text-[11px] font-bold mt-1" style="color: rgb(79,169,18);">홈</span>
    </div>
    <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="community.html">
      <span class="material-symbols-outlined text-[22px]">group</span>
      <span class="font-label-sm text-[11px]">커뮤니티</span>
    </a>
    <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="mypage.html">
      <span class="material-symbols-outlined text-[22px]">person</span>
      <span class="font-label-sm text-[11px]">마이</span>
    </a>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../backend/data/supabaseClient.js"></script>
<script src="../backend/user_logout.js"></script>
<script>
  requestAnimationFrame(() => document.body.classList.add('page-loaded'));
  document.querySelectorAll('a[href]').forEach(function (link) {
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
    link.addEventListener('click', function (e) {
      e.preventDefault();
      document.body.classList.remove('page-loaded');
      setTimeout(function () { window.location.href = href; }, 200);
    });
  });
</script>

<!-- 로그인한 사용자의 이름/포인트/제보 건수를 마이페이지 API에서 불러와 표시 (mypage.html과 동일) -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const nameEl = document.getElementById('profile-name');
    const avatarEl = document.getElementById('profile-avatar');
    const pointEl = document.getElementById('userPointText');
    const reportCountEl = document.getElementById('myReportCount');
    if (!nameEl) return;

    const { data: { session } } = await sb.auth.getSession();
    const user = session?.user;
    if (!user) {
      location.href = 'login.html';
      return;
    }

    const displayName = user.user_metadata?.name || user.email || '회원';
    nameEl.textContent = displayName;
    if (avatarEl && user.user_metadata?.avatar_url) {
      avatarEl.src = user.user_metadata.avatar_url;
      avatarEl.classList.remove('hidden');
      document.getElementById('profile-avatar-icon')?.classList.add('hidden');
    }

    const authHeaders = { Authorization: `Bearer ${session.access_token}` };

    try {
      const res = await fetch('/api/mypage/points', { headers: authHeaders });
      if (!res.ok) throw new Error(`포인트 조회 실패: ${res.status}`);
      const { points } = await res.json();
      if (pointEl) pointEl.textContent = Number(points ?? 0).toLocaleString();
    } catch (err) {
      console.error('포인트를 불러오지 못했습니다:', err);
      if (pointEl) pointEl.textContent = '0';
    }

    try {
      const res = await fetch('/api/mypage/reports', { headers: authHeaders });
      if (!res.ok) throw new Error(`제보 내역 조회 실패: ${res.status}`);
      const { reports } = await res.json();
      if (reportCountEl) reportCountEl.firstChild.textContent = String(reports?.length ?? 0);
    } catch (err) {
      console.error('제보 내역을 불러오지 못했습니다:', err);
      if (reportCountEl) reportCountEl.firstChild.textContent = '0';
    }
  });
</script>
</body></html>
