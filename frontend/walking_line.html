  <!-- Decorative micro-interactions (음성 안내 볼륨 토글) -->
  <script>
    document.querySelectorAll('[aria-label="음성 안내 볼륨"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const icon = btn.querySelector('span');
        if (icon.textContent === 'volume_up') {
          icon.textContent = 'volume_off';
          icon.classList.remove('text-primary');
          icon.classList.add('text-outline');
        } else {
          icon.textContent = 'volume_up';
          icon.classList.remove('text-outline');
          icon.classList.add('text-primary');
        }
      });
    });
  </script>

  <!-- 실제 동작 로직: 도형 산책로 생성 + 실시간 GPS 추적 + 일치도/리워드 -->
  <script type="module">
    import { supabase } from '../backend/data/supabaseService.js';
    import { generateShapeRoute, SHAPE_CONFIG } from '../backend/data/shapeRouteService.js';
    import { analyzeGpsSimilarity } from '../backend/data/patternMatchService.js';

    const SHAPE_ORDER = ['rhombus', 'heart', 'star', 'fish', 'crown'];
    const SHAPE_ICON = { rhombus: 'diamond', heart: 'favorite', star: 'star', fish: 'set_meal', crown: 'crown' };
    const SHAPE_ZOOM = { rhombus: 18, heart: 17, star: 16, fish: 15, crown: 14 };
    const DEFAULT_CENTER = { lat: 37.5665, lng: 126.978 }; // 서울시청 (위치 미허용 시 폴백)

    let shapeIndex = SHAPE_ORDER.indexOf('star');
    let userLocation = null;
    let userId = null;
    let currentRoute = null;
    let routePolyline = null;
    let watchId = null;
    let gpsLog = [];

    const map = new Tmapv2.Map('map_div', {
      center: new Tmapv2.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng),
      width: '100%',
      height: '100%',
      zoom: 16,
    });

    const courseIcon = document.getElementById('courseIcon');
    const courseName = document.getElementById('courseName');
    const courseDurationBadge = document.getElementById('courseDurationBadge');
    const courseInfo = document.getElementById('courseInfo');
    const currentPositionLabel = document.getElementById('currentPositionLabel');
    const walkStatusLine1 = document.getElementById('walkStatusLine1');
    const walkStatusLine2 = document.getElementById('walkStatusLine2');
    const resultLine = document.getElementById('resultLine');
    const btnStartGuide = document.getElementById('btnStartGuide');
    const btnEndGuide = document.getElementById('btnEndGuide');

    function renderCourseCard() {
      const shape = SHAPE_ORDER[shapeIndex];
      const config = SHAPE_CONFIG[shape];
      courseIcon.textContent = SHAPE_ICON[shape];
      courseName.textContent = `${config.label}모양 산책로`;
      courseDurationBadge.textContent = `${config.durationMin}분 코스`;
      courseInfo.textContent = `목표 ${config.targetDistanceKm}km · 안내 시작을 누르면 실제 경로가 그려집니다`;
    }
    renderCourseCard();

    document.getElementById('btnChangeCourse').addEventListener('click', () => {
      if (watchId !== null) return; // 안내 중에는 코스 변경 불가
      shapeIndex = (shapeIndex + 1) % SHAPE_ORDER.length;
      renderCourseCard();
    });

    function updateUserLocation(lat, lng, label) {
      userLocation = { lat, lng };
      currentPositionLabel.textContent = label;
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          updateUserLocation(pos.coords.latitude, pos.coords.longitude, '현위치 확인됨');
          map.setCenter(new Tmapv2.LatLng(pos.coords.latitude, pos.coords.longitude));
        },
        () => {
          updateUserLocation(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng, '위치 접근 거부 - 서울시청 기준');
        }
      );
    } else {
      updateUserLocation(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng, '위치 미지원 - 서울시청 기준');
    }

    document.getElementById('btnRecenter').addEventListener('click', () => {
      if (userLocation) map.setCenter(new Tmapv2.LatLng(userLocation.lat, userLocation.lng));
    });

    btnStartGuide.addEventListener('click', async () => {
      if (!userLocation) return;
      const shape = SHAPE_ORDER[shapeIndex];
      const config = SHAPE_CONFIG[shape];

      btnStartGuide.disabled = true;
      walkStatusLine1.textContent = `${config.label}모양 산책로 생성 중...`;
      walkStatusLine2.textContent = '실제 도로를 따라가므로 몇 초 걸릴 수 있어요';
      resultLine.textContent = '';

      try {
        currentRoute = await generateShapeRoute({ lat: userLocation.lat, lng: userLocation.lng, shape });

        if (routePolyline) routePolyline.setMap(null);
        routePolyline = new Tmapv2.Polyline({
          path: currentRoute.waypoints.map((c) => new Tmapv2.LatLng(c.lat, c.lng)),
          strokeColor: '#4fa912',
          strokeWeight: 6,
          map,
        });
        map.setZoom(SHAPE_ZOOM[shape] ?? 16);
        map.setCenter(new Tmapv2.LatLng(userLocation.lat, userLocation.lng));

        courseInfo.textContent =
          `실제 거리 ${currentRoute.distanceKm.toFixed(2)}km · 안심점수 ${currentRoute.score}` +
          (currentRoute.blocked ? ' · 경로상 위험제보 있음' : '');

        gpsLog = [];
        walkStatusLine1.textContent = '안내 중 - 실제로 걸어보세요';
        walkStatusLine2.textContent = 'GPS 궤적을 기록하고 있어요';
        btnEndGuide.disabled = false;

        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              gpsLog.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, timestamp: Date.now() });
              updateUserLocation(pos.coords.latitude, pos.coords.longitude, '이동 중');
            },
            () => {},
            { enableHighAccuracy: true }
          );
        }
      } catch (err) {
        walkStatusLine1.textContent = '산책로 생성 실패';
        walkStatusLine2.textContent = err.message;
        btnStartGuide.disabled = false;
      }
    });

    btnEndGuide.addEventListener('click', async () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      btnEndGuide.disabled = true;
      btnStartGuide.disabled = false;
      walkStatusLine1.textContent = '아직 안내를 시작하지 않았습니다';
      walkStatusLine2.textContent = '코스를 고르고 안내를 시작해보세요';

      if (!currentRoute) return;

      if (gpsLog.length < 2) {
        resultLine.textContent = 'GPS 기록이 너무 적어 일치도를 분석할 수 없습니다.';
        return;
      }
      if (!userId) {
        resultLine.textContent = '로그인하면 완주 일치도를 분석하고 리워드를 받을 수 있어요.';
        return;
      }

      resultLine.textContent = '일치도 분석 중...';
      const result = await analyzeGpsSimilarity(currentRoute.waypoints, gpsLog, userId);
      resultLine.textContent = `일치도 ${result.similarityScore}% - ${result.message}`;
    });

    const {
      data: { user },
    } = await supabase.auth.getUser();
    if (user) userId = user.id;
  </script>
