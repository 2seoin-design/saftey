<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-fixed-dim": "#80d5cb",
            "on-primary-fixed": "#00201d",
            "on-tertiary-container": "#dbecff",
            "secondary": "#006c49",
            "surface-container-lowest": "#ffffff",
            "tertiary": "#005683",
            "on-error-container": "#93000a",
            "outline": "#6e7977",
            "secondary-container": "#6cf8bb",
            "primary-container": "#0f766e",
            "on-secondary": "#ffffff",
            "on-primary-container": "#a3faef",
            "on-primary-fixed-variant": "#00504a",
            "on-secondary-container": "#00714d",
            "error": "#ba1a1a",
            "on-tertiary-fixed-variant": "#004b73",
            "background": "#f9f9ff",
            "tertiary-container": "#006fa8",
            "surface-container-highest": "#dce2f7",
            "on-background": "#141b2b",
            "inverse-primary": "#80d5cb",
            "surface-bright": "#f9f9ff",
            "inverse-surface": "#293040",
            "on-primary": "#ffffff",
            "surface-variant": "#dce2f7",
            "on-secondary-fixed": "#002113",
            "surface-dim": "#d3daef",
            "surface-container-high": "#e1e8fd",
            "surface-tint": "#006a63",
            "surface-container": "#e9edff",
            "primary-fixed": "#9cf2e8",
            "tertiary-fixed": "#cce5ff",
            "secondary-fixed-dim": "#4edea3",
            "on-surface": "#141b2b",
            "tertiary-fixed-dim": "#93ccff",
            "surface-container-low": "#f1f3ff",
            "error-container": "#ffdad6",
            "on-surface-variant": "#3e4947",
            "primary": "#005c55",
            "on-secondary-fixed-variant": "#005236",
            "surface": "#f9f9ff",
            "inverse-on-surface": "#edf0ff",
            "on-tertiary-fixed": "#001d31",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "outline-variant": "#bdc9c6",
            "secondary-fixed": "#6ffbbe"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-sm": "0.75rem",
            "space-xs": "0.5rem",
            "space-xxs": "0.25rem",
            "space-lg": "1.5rem",
            "gutter-mobile": "1rem",
            "gutter-desktop": "1.5rem",
            "container-max": "1200px",
            "space-3xl": "4.5rem",
            "space-md": "1rem",
            "space-2xl": "3rem",
            "space-xl": "2rem"
          },
          "fontFamily": {
            "body-lg": ["Plus Jakarta Sans"],
            "title-sm": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "display-hero-mobile": ["Plus Jakarta Sans"],
            "headline-xl-mobile": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "display-hero": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "body-lg": ["16px", {"lineHeight": "26px", "fontWeight": "400"}],
            "title-sm": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600"}],
            "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}],
            "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "700"}],
            "display-hero-mobile": ["28px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
            "headline-xl-mobile": ["24px", {"lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "700"}],
            "headline-xl": ["32px", {"lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
            "body-md": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
            "display-hero": ["44px", {"lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "800"}]
          }
        }
      }
    };
  </script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior-y: none;
        background-color: #f9f9ff;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen">
  <!-- Top App Navigation Bar -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-gutter-mobile flex items-center justify-between gap-space-xs">
      <div class="flex items-center gap-space-xs">
        <div class="flex items-center gap-2">
          <img alt="세이프티" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAT5WSmAdRD3SK1Qj_wIc6Aep1lhhkB9bLp23mRWdtMKSrUJXn7eEgVLtvAY9rxjrlYJyWCwy0PJ0JVMH-Kp0M5sC5GzCC_RE-fFYR4JH3s5If_bqtiW_p5YJ4Hsb4qZ-KdP3d_eOpMKGU8gamQjwtKW1IhE-1yTZOj28nlUY5IwjZRbjW0QVZchkOZWJaMK6IfMBoUkMODqLUerOHapQZEbAOxFW7icD81CRgGrXJJ1DvTvLLY9GQH9f3V3O_zQEB17Lo">
          <span class="font-headline-md text-headline-md font-bold text-on-surface">안전산책로 길안내<br></span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button aria-label="제보 안내 도움말" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined text-[22px]">help_outline</span>
        </button>
        <button class="w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm" style="background: linear-gradient(135deg, rgb(96, 194, 25) 0%, rgb(79, 169, 18) 100%);" type="button">
          <span class="material-symbols-outlined text-[20px]">add</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full">
      <!-- Route Title Card -->
      <section class="px-gutter-mobile pt-space-xs pb-space-sm w-full">
        <div class="flex items-center justify-between bg-surface-container-lowest/95 backdrop-blur-md px-3.5 py-2.5 rounded-xl shadow-sm border border-outline-variant/30">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white shadow-sm" style="background: linear-gradient(135deg, rgb(105, 208, 15) 0%, rgb(79, 169, 18) 100%);">
              <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">star</span>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5">
                <span class="font-label-md text-label-md font-bold text-on-surface">별모양 산책로</span>
                <span class="px-1.5 py-0.5 rounded-full text-[10px] font-bold text-white leading-none" style="background: linear-gradient(135deg, rgb(105, 208, 15) 0%, rgb(79, 169, 18) 100%);">추천코스</span>
              </div>
              <span class="font-label-sm text-label-sm text-on-surface-variant text-[11px]">총 2.4km · 안전 조명 100% 안심가도</span>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button type="button" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-secondary text-label-sm font-semibold transition-colors">
              <span class="material-symbols-outlined text-[15px]">swap_horiz</span>
              <span>코스변경</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Map Canvas (세로 높이 h-[480px]로 확장) -->
      <section class="px-gutter-mobile py-space-xs w-full">
        <div class="relative w-full h-[480px] rounded-xl overflow-hidden shadow-md bg-surface-container-low" data-location="Seoul Hyehwa Marronnier Park Safe Walking Trail">
          <!-- Vector Trail Overlay -->
          <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" fill="none" viewBox="0 0 360 480">
            <!-- Route Path -->
            <path d="M 60 410 C 90 360, 110 320, 120 280 C 130 220, 180 200, 210 160 C 240 120, 270 90, 290 50" opacity="0.45" stroke="#6cf8bb" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
            <path d="M 60 410 C 90 360, 110 320, 120 280 C 130 220, 180 200, 210 160 C 240 120, 270 90, 290 50" stroke="#006c49" stroke-dasharray="2 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
            
            <!-- Waypoint Nodes -->
            <circle cx="120" cy="280" fill="#ffffff" r="5" stroke="#006c49" stroke-width="3"></circle>
            <circle cx="210" cy="160" fill="#ffffff" r="5" stroke="#006c49" stroke-width="3"></circle>
            <circle cx="290" cy="50" fill="#0f766e" r="7" stroke="#ffffff" stroke-width="3"></circle>
            
            <!-- Current Location Pulsing Ring -->
            <circle class="animate-ping" cx="60" cy="410" fill="#6cf8bb" opacity="0.35" r="16" style="transform-origin: 60px 410px;"></circle>
            <circle cx="60" cy="410" fill="#005c55" r="9" stroke="#ffffff" stroke-width="3"></circle>
          </svg>

          <!-- Current Position Callout -->
          <div class="absolute bottom-16 left-4 z-20 flex items-center gap-1.5 bg-surface-container-lowest/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md">
            <span class="w-2.5 h-2.5 rounded-full bg-secondary animate-pulse"></span>
            <span class="font-label-sm text-label-sm text-on-surface font-bold">현위치: 마로니에 공원 입구</span>
          </div>

          <!-- POI 1: Shelter -->
          <div class="absolute top-[248px] left-[130px] z-20 flex items-center gap-1 bg-surface-container-lowest/95 backdrop-blur-md px-2 py-1 rounded-full shadow-sm">
            <span class="material-symbols-outlined text-[15px] text-primary" style="font-variation-settings: 'FILL' 1;">park</span>
            <span class="font-label-sm text-label-sm text-on-surface">수목 그늘 쉼터</span>
          </div>

          <!-- POI 2: Emergency Bell -->
          <div class="absolute top-[130px] left-[165px] z-20 flex items-center gap-1 bg-surface-container-lowest/95 backdrop-blur-md px-2 py-1 rounded-full shadow-sm">
            <span class="material-symbols-outlined text-[15px] text-error" style="font-variation-settings: 'FILL' 1;">emergency</span>
            <span class="font-label-sm text-label-sm text-on-surface">안심 비상벨 (5개소)</span>
          </div>

          <!-- POI 3: Streetlight -->
          <div class="absolute top-[42px] right-4 z-20 flex items-center gap-1 bg-surface-container-lowest/95 backdrop-blur-md px-2 py-1 rounded-full shadow-sm">
            <span class="material-symbols-outlined text-[15px] text-secondary" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
            <span class="font-label-sm text-label-sm text-on-surface">스마트 가로등 (55 Lux)</span>
          </div>

          <!-- Patrol Status Badge -->
          <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 bg-secondary text-on-secondary px-3 py-1 rounded-full shadow-md">
            <span class="material-symbols-outlined text-[16px]">shield_person</span>
            <span class="font-label-sm text-label-sm font-bold">김지혜 파수꾼 순찰 중</span>
          </div>

          <!-- Floating Map Controls -->
          <div class="absolute right-3 bottom-14 z-20 flex flex-col gap-2">
            <button aria-label="음성 안내 볼륨" class="w-10 h-10 rounded-full bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-center hover:bg-surface-container transition-colors active:scale-95">
              <span class="material-symbols-outlined text-[20px] text-primary">volume_up</span>
            </button>
            <button aria-label="경로 레이어 전환" class="w-10 h-10 rounded-full bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-center hover:bg-surface-container transition-colors active:scale-95">
              <span class="material-symbols-outlined text-[20px] text-on-surface-variant">layers</span>
            </button>
            <button aria-label="현위치 재정렬" class="w-10 h-10 rounded-full bg-surface-container-lowest text-on-surface shadow-md flex items-center justify-center hover:bg-surface-container transition-colors active:scale-95">
              <span class="material-symbols-outlined text-[20px] text-secondary">my_location</span>
            </button>
          </div>

          <!-- Pace Indicator Bar -->
          <div class="absolute bottom-2.5 inset-x-3 z-20 flex items-center justify-between bg-surface-container-lowest/90 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-sm">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
                <span class="material-symbols-outlined text-[18px]">directions_walk</span>
              </div>
              <div class="flex flex-col">
                <span class="font-label-sm text-label-sm text-on-surface font-bold">현재 보행속도 3.5 km/h</span>
                <span class="font-label-sm text-label-sm text-secondary font-semibold">쾌적 안심 산책 페이스</span>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px] text-secondary">air</span>
              <span class="font-label-sm text-label-sm text-on-surface-variant">피톤치드 보통 (0.8ppm)</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Navigation Action Buttons -->
      <section class="px-gutter-mobile pt-space-xs pb-space-lg w-full">
        <div class="flex items-center gap-3 w-full">
          <button type="button" class="flex-1 h-[52px] rounded-full text-white font-bold font-label-md text-label-md flex items-center justify-center gap-2 shadow-md active:scale-98 transition-all" style="background: linear-gradient(135deg, rgb(105, 208, 15) 0%, rgb(79, 169, 18) 100%); box-shadow: rgba(79, 169, 18, 0.3) 0px 4px 14px;">
            <span class="material-symbols-outlined text-[20px]">navigation</span>
            <span>안내 시작</span>
          </button>
          <button type="button" class="flex-1 h-[52px] rounded-full bg-surface-container-high text-on-surface-variant font-semibold font-label-md text-label-md flex items-center justify-center gap-1.5 hover:bg-surface-dim active:scale-98 transition-all">
            <span class="material-symbols-outlined text-[20px]">close</span>
            <span>안내 종료</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-4px_24px_rgba(15,118,110,0.08)] border-t border-outline-variant/30">
    <div class="flex items-center justify-around h-16 px-space-xs relative">
      <a class="flex flex-col items-center justify-center w-14 h-12 gap-0.5 text-on-surface-variant hover:text-primary transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">home</span>
        <span class="font-label-sm text-label-sm">홈</span>
      </a>
      <div class="flex flex-col items-center -mt-6">
        <a class="w-[52px] h-[52px] rounded-full shadow-lg flex flex-col items-center justify-center active:scale-95 transition-transform text-white" href="#" style="background: linear-gradient(135deg, rgb(96, 194, 25) 0%, rgb(79, 169, 18) 100%); box-shadow: rgba(96, 194, 25, 0.35) 0px 6px 16px;">
          <span class="material-symbols-outlined text-[26px] text-white">map</span>
        </a>
        <span class="font-label-sm text-label-sm font-bold mt-1" style="color: rgb(79, 169, 18);">안전지도</span>
      </div>
      <a class="flex flex-col items-center justify-center w-14 h-12 gap-0.5 text-on-surface-variant hover:text-primary transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">photo_camera</span>
        <span class="font-label-sm text-label-sm">10초제보</span>
      </a>
      <a class="flex flex-col items-center justify-center w-14 h-12 gap-0.5 text-on-surface-variant hover:text-primary transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">person</span>
        <span class="font-label-sm text-label-sm">마이</span>
      </a>
    </div>
  </nav>

  <!-- Interactions Script -->
  <script>
    // Audio guidance toggle
    document.querySelectorAll('[aria-label="음성 안내 볼륨"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const icon = btn.querySelector('span');
        if (icon.textContent === 'volume_up') {
          icon.textContent = 'volume_off';
          icon.classList.remove('text-primary');
          icon.classList.add('text-outline');
        } else {
          icon.textContent = 'volume_up';
          icon.classList.remove('text-outline');
          icon.classList.add('text-primary');
        }
      });
    });

    // Layer switch feedback
    document.querySelectorAll('[aria-label="경로 레이어 전환"]').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('bg-secondary-container');
        btn.classList.toggle('text-on-secondary-container');
      });
    });
  </script>
</body>
</html>
