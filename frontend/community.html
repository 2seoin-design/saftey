  <style>
    @layer base {

    body.page-transition { opacity: 0; transition: opacity 0.22s ease; }
    body.page-transition.page-loaded { opacity: 1; }

<body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen page-transition">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,0,0,0.04)]">
    <div class="relative h-16 px-gutter-mobile flex items-center justify-between gap-space-xs">
      <div class="flex items-center gap-2">
        <a href="mainhome.html" aria-label="홈으로 이동">
          <img alt="세이프티" class="h-12 w-auto object-contain" src="../img/safety_logo_image.png">
        </a>
        <h1 class="font-headline-md text-headline-md font-bold text-on-surface">커뮤니티</h1>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full px-gutter-mobile pt-space-sm gap-space-sm">

      <div id="feedList" class="flex flex-col gap-space-sm" data-purpose="feed-list">
        <p class="text-xs text-on-surface-variant text-center py-8">불러오는 중...</p>
      </div>

      <!-- 페이지네이션 -->
      <nav id="pagination" class="flex items-center justify-center gap-1.5 py-space-md"></nav>
    </div>
  </main>

  <!-- Floating Write Button -->
  <div class="fixed bottom-20 right-5 z-40">
    <button class="safety-btn-grad text-white font-bold text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-1.5 active:scale-95 transition-transform" type="button" style="box-shadow: rgba(96, 194, 25, 0.3) 0px 8px 20px;" onclick="location.href='add_comm.html'">
      <span class="material-symbols-outlined text-[16px]">edit</span>
      <span>안심 글쓰기</span>
    </button>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-xl border-t border-outline-variant/30 shadow-lg pb-safe">
    <div class="h-16 px-2 flex items-center justify-around relative">
      <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="10report.html">
        <span class="material-symbols-outlined text-[22px]">photo_camera</span>
        <span class="font-label-sm text-[11px]">10초제보</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="safymap.html">
        <span class="material-symbols-outlined text-[22px]">map</span>
        <span class="font-label-sm text-[11px]">안전지도</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="mainhome.html">
        <span class="material-symbols-outlined text-[22px]">home</span>
        <span class="font-label-sm text-[11px]">홈</span>
      </a>
      <div class="flex-1 flex flex-col items-center relative -top-3">
        <a aria-current="page" class="w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95" href="community.html" style="background: linear-gradient(135deg, rgb(96, 194, 25) 0%, rgb(79, 169, 18) 100%); box-shadow: rgba(96, 194, 25, 0.35) 0px 6px 16px;">
          <span class="material-symbols-outlined text-[26px]" style="font-variation-settings: &quot;FILL&quot; 1;">group</span>
        </a>
        <span class="font-label-sm text-[11px] font-bold mt-1" style="color: rgb(79, 169, 18);">커뮤니티</span>
      </div>
      <a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-primary transition-colors flex-1 py-1" href="mypage.html">

        <span class="font-label-sm text-[11px]">마이</span>

  <!-- Script for Page Transition -->
  <script>
    requestAnimationFrame(() => document.body.classList.add('page-loaded'));
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
      link.addEventListener('click', function(e) {
        e.preventDefault();
        document.body.classList.remove('page-loaded');
        setTimeout(function() {
          window.location.href = href;
        }, 200);
      });
    });
  </script>

  <!-- 실제 게시글 목록 + 페이지네이션 -->
  <script type="module">
    import { supabase } from '../backend/data/supabaseService.js';
    import { fetchPosts, deletePost } from '../backend/data/communityService.js';

    const feedList = document.getElementById('feedList');
    const pagination = document.getElementById('pagination');

    const params = new URLSearchParams(location.search);
    let currentPage = Math.max(1, parseInt(params.get('page'), 10) || 1);
    let currentUserId = null;

    const AVATAR_COLORS = ['bg-emerald-100 border-emerald-200 text-emerald-700', 'bg-blue-100 border-blue-200 text-blue-700', 'bg-amber-100 border-amber-200 text-amber-800'];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderPost(post, index) {
      const colorClass = AVATAR_COLORS[index % AVATAR_COLORS.length];
      const initial = (post.title || '?').trim().charAt(0);
      const isOwner = currentUserId && post.author_id === currentUserId;

      return `
        <article class="bg-surface-container-lowest rounded-2xl p-4 border border-outline-variant/30 shadow-sm space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
              <div class="w-9 h-9 rounded-full border flex items-center justify-center font-bold text-xs ${colorClass}">${escapeHtml(initial)}</div>
              <div class="flex flex-col">
                <span class="text-xs font-bold text-on-surface">${formatDate(post.created_at)}</span>
              </div>
            </div>
            ${isOwner ? `
              <div class="flex items-center gap-1">
                <button class="text-on-surface-variant hover:text-primary text-[11px] font-bold px-2 py-1" data-action="edit" data-id="${post.id}">수정</button>
                <button class="text-on-surface-variant hover:text-error text-[11px] font-bold px-2 py-1" data-action="delete" data-id="${post.id}">삭제</button>
              </div>
            ` : ''}
          </div>
          <div class="space-y-1.5">
            <h3 class="text-sm font-bold text-on-surface leading-snug">${escapeHtml(post.title)}</h3>
            <p class="text-xs text-on-surface-variant leading-relaxed line-clamp-3">${escapeHtml(post.content)}</p>
            ${post.image_url ? `<img src="${post.image_url}" alt="현장 사진" class="w-full h-40 object-cover rounded-xl mt-1.5">` : ''}
          </div>
        </article>
      `;
    }

    function renderPagination(page, totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }
      let html = '';
      for (let p = 1; p <= totalPages; p += 1) {
        const active = p === page;
        html += `<button data-page="${p}" class="w-8 h-8 rounded-full text-xs font-bold transition-colors ${active ? 'safety-btn-grad text-white' : 'bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container'}">${p}</button>`;
      }
      pagination.innerHTML = html;
      pagination.querySelectorAll('[data-page]').forEach((btn) => {
        btn.addEventListener('click', () => loadPage(parseInt(btn.dataset.page, 10)));
      });
    }

    async function loadPage(page) {
      currentPage = page;
      history.replaceState(null, '', `community.html?page=${page}`);
      feedList.innerHTML = '<p class="text-xs text-on-surface-variant text-center py-8">불러오는 중...</p>';

      try {
        const { posts, totalPages } = await fetchPosts(page);
        if (posts.length === 0) {
          feedList.innerHTML = '<p class="text-xs text-on-surface-variant text-center py-8">아직 등록된 안심 소식이 없습니다. 첫 글을 남겨보세요!</p>';
        } else {
          feedList.innerHTML = posts.map(renderPost).join('');
          feedList.querySelectorAll('[data-action="edit"]').forEach((btn) => {
            btn.addEventListener('click', () => (location.href = `add_comm.html?id=${btn.dataset.id}`));
          });
          feedList.querySelectorAll('[data-action="delete"]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
              await deletePost(btn.dataset.id);
              loadPage(currentPage);
            });
          });
        }
        renderPagination(page, totalPages);
      } catch (err) {
        feedList.innerHTML = `<p class="text-xs text-error text-center py-8">목록을 불러오지 못했습니다: ${escapeHtml(err.message)}</p>`;
      }
    }

    const {
      data: { user },
    } = await supabase.auth.getUser();
    currentUserId = user?.id ?? null;
    loadPage(currentPage);
  </script>
