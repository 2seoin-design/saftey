    <!-- 필터 스크립트 -->
    <script>
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => {
            t.classList.remove('bg-primary', 'text-on-primary');
            t.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
          });
          tab.classList.add('bg-primary', 'text-on-primary');
          tab.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');

          const filter = tab.getAttribute('data-filter');
          const cards = document.querySelectorAll('.report-card');

          cards.forEach(card => {
            if (filter === 'all' || card.dataset.status === filter) {
              card.style.display = 'block';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });

      function handleNewReport() {
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(20);
        }
        alert('카메라 및 위치 확인 후 10초 간편제보 화면으로 이동합니다.');
      }
    </script>

    <!-- 마이페이지 API에서 실제 제보 내역을 불러와 표시 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../backend/data/supabaseClient.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const nameEl = document.getElementById('reportListUserName');
        const statTotal = document.getElementById('statTotal');
        const statPending = document.getElementById('statPending');
        const statDone = document.getElementById('statDone');
        const filterCountAll = document.getElementById('filterCountAll');
        const filterCountPending = document.getElementById('filterCountPending');
        const filterCountDone = document.getElementById('filterCountDone');
        const container = document.getElementById('report-cards-container');
        const statusEl = document.getElementById('reportListStatus');

        const session = await getFreshSession();
        if (!session) {
          location.href = 'login.html';
          return;
        }

        const displayName = session.user.user_metadata?.name || session.user.email || '회원';
        if (nameEl) nameEl.textContent = displayName;

        function formatDateTime(iso) {
          const d = new Date(iso);
          const pad = (n) => String(n).padStart(2, '0');
          return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function renderCard(report) {
          const isDone = report.status === 'DONE';
          const article = document.createElement('article');
          article.className = 'report-card bg-surface-container-lowest rounded-2xl p-space-md shadow-sm transition-all hover:shadow-md';
          article.dataset.status = report.status;
          article.innerHTML = `
            <div class="flex items-start justify-between gap-2 mb-space-xs">
              <div class="inline-flex items-center gap-1.5 ${isDone ? 'bg-secondary-container/40 text-on-secondary-container' : 'bg-surface-container text-on-surface-variant'} px-2.5 py-1 rounded-full">
                <span class="material-symbols-outlined text-[16px] ${isDone ? 'text-secondary' : ''}" style="${isDone ? "color: rgb(96, 194, 25); font-variation-settings: 'FILL' 1;" : ''}">${isDone ? 'check_circle' : 'hourglass_empty'}</span>
                <span class="font-label-sm text-label-sm font-bold">${report.statusLabel}</span>
              </div>
              <span class="font-label-sm text-label-sm text-on-surface-variant">${formatDateTime(report.reportedAt)}</span>
            </div>
            <h3 class="font-title-sm text-title-sm text-on-surface font-bold mb-1">${report.reportTypeLabel}</h3>
            ${report.description ? `<p class="font-body-md text-body-md text-on-surface-variant mb-space-xs">${report.description}</p>` : ''}
            ${report.photoUrl ? `
              <div class="relative w-full h-44 rounded-xl overflow-hidden shadow-sm bg-surface-container">
                <img class="w-full h-full object-cover" alt="제보 현장 사진" src="${report.photoUrl}">
              </div>
            ` : ''}
          `;
          return article;
        }

        try {
          const res = await fetch('/api/mypage/reports', {
            headers: { Authorization: `Bearer ${session.access_token}` },
          });
          if (!res.ok) throw new Error(`제보 내역 조회 실패: ${res.status}`);
          const { reports } = await res.json();

          const pendingCount = reports.filter((r) => r.status === 'PENDING').length;
          const doneCount = reports.filter((r) => r.status === 'DONE').length;

          [statTotal, filterCountAll].forEach((el) => { if (el) (el.firstChild ?? el).textContent = String(reports.length); });
          if (statPending) statPending.firstChild.textContent = String(pendingCount);
          if (statDone) statDone.firstChild.textContent = String(doneCount);
          if (filterCountPending) filterCountPending.textContent = String(pendingCount);
          if (filterCountDone) filterCountDone.textContent = String(doneCount);

          statusEl.remove();
          if (reports.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'text-center py-10 text-on-surface-variant font-label-md text-label-md';
            empty.textContent = '아직 등록한 제보가 없어요.';
            container.appendChild(empty);
          } else {
            reports.forEach((report) => container.appendChild(renderCard(report)));
          }
        } catch (err) {
          console.error('제보 내역을 불러오지 못했습니다:', err);
          statusEl.textContent = '제보 내역을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
          [statTotal, statPending, statDone].forEach((el) => { if (el) el.firstChild.textContent = '0'; });
        }
      });
    </script>
