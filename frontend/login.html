<!DOCTYPE html>

<html lang="ko" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>로그인 - 세이프티</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .safety-gradient {
      background: linear-gradient(135deg, #60c219 0%, #4fa912 100%);
    }
    .safety-text {
      color: #55b214;
    }
    .safety-border {
      border-color: #60c219;
    }
  </style>
</head>
<body class="text-slate-900 flex min-h-screen bg-white">
<div class="w-full bg-white min-h-screen flex flex-col relative pb-28">
<!-- 상단 헤더 (메인 홈화면 완벽 일치) -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-slate-100 flex items-center justify-between">
<div class="flex items-center gap-2">
<img alt="세이프티 로고" class="h-8 object-contain cursor-pointer" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNaw0-vhUEjnyvFFtvkcAhibJOjMlonIdY6zxXOJU3cQjgHlk-6micoGqGclVkEBzrr2a89bJbmGTiqHkVHy5ATQpo2I-jBOkWd-AL_Yhgncd0hhRM8SXWg4pSPhJZcDA9W82sDG09n3lMD_bTysF4_rjSDoQBFZzhaPXkRSgGmxNVPvUn5qETL82eI45N2FzgXcuEJKp4-M12xhOH2yKSUvtmrx6oey7YfFFEbOEwWZQ7iriobvfDx9azkpv8dG5-I50"/>
<button class="flex items-center gap-1 text-xs font-semibold text-slate-700 bg-slate-100/80 hover:bg-slate-200/80 px-2.5 py-1.5 rounded-full transition-colors">
<span class="">종로구 혜화동</span>
<span class="material-symbols-outlined text-sm text-slate-500">arrow_drop_down</span>
</button>
</div>
<div class="flex items-center gap-2">
<!-- 알림 버튼 (배지 포함) -->
<button aria-label="알림" class="relative p-2 text-slate-700 hover:text-slate-900 hover:bg-slate-50 rounded-full transition-colors">
<span class="material-symbols-outlined text-[22px]">notifications</span>
<span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
</button>
<!-- 빠른 추가 버튼 -->
<button aria-label="새 제보 작성" class="w-8 h-8 rounded-full safety-gradient text-white flex items-center justify-center shadow-md shadow-lime-500/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl">add</span>
</button>
</div>
</header>
<!-- 메인 본문: 세이프티 로그인 폼 -->
<main class="flex-1 px-5 pt-8 flex flex-col justify-center">
<!-- 서비스 브랜딩 & 환영 헤더 -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-[#f2faea] to-[#e5f7d7] border border-[#60c219]/20 shadow-sm mb-4">
<img alt="세이프티 로고 아이콘" class="h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkuWusbZpczxDKGNtnfYRizkLHeofqSwjMKsgA1u8EqNgHSYPimvhWfnTCO5-80MKdCVcZR6fLno_ArFzGLqDMejoo1CnqkOKQBcoIQWhDoyFbiFXXi5pZxwyT4XKj7-WC4KzYMFMxGdQRWUVuIWgd2XWR0IazU5NjS1qgH2Hjo9lZdZZGKOgaqG7g3QZ1HSUkG2jQFR2rpAinn51I3d1y6BgKY1eDNMI2K48BXELencQjuN_iKZBD5gnMzf0icCAc3hs"/>
</div>
<h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1.5">
          더 안전한 일상으로 로그인
        </h1>
<p class="text-xs text-slate-500 font-medium leading-relaxed">
          시민이 함께 만드는 실시간 무장애 안심 플랫폼, 세이프티
        </p>
</div>
<!-- 로그인 입력 폼 -->
<form class="space-y-4" onsubmit="event.preventDefault()">
<!-- 아이디 / 이메일 입력 -->
<div>
<label class="block text-xs font-bold text-slate-700 mb-1.5">아이디 또는 이메일</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg pointer-events-none">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#60c219] focus:bg-white focus:ring-2 focus:ring-[#60c219]/20 transition-all" placeholder="example@safety.kr" type="text"/>
</div>
</div>
<!-- 비밀번호 입력 -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="text-xs font-bold text-slate-700">비밀번호</label>
<a class="text-xs font-semibold safety-text hover:underline" href="#forgot">비밀번호 찾기</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg pointer-events-none">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#60c219] focus:bg-white focus:ring-2 focus:ring-[#60c219]/20 transition-all" placeholder="8자리 이상 영문, 숫자, 특수문자" type="password"/>
<button aria-label="비밀번호 보기" class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- 자동 로그인 및 아이디 저장 체크박스 -->
<div class="flex items-center justify-between py-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded border-slate-300 text-[#60c219] focus:ring-[#60c219] focus:ring-offset-0" type="checkbox"/>
<span class="text-xs font-medium text-slate-600">로그인 상태 유지</span>
</label>
<a class="text-xs text-slate-400 hover:text-slate-600" href="#find-id">아이디 찾기</a>
</div>
<!-- 로그인 메인 CTA 버튼 -->
<button class="w-full py-3.5 safety-gradient text-white rounded-xl font-bold text-sm shadow-md shadow-[#60c219]/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2" type="submit">
<span class="">로그인</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</form>
<!-- 간편 소셜 로그인 구분선 -->
<div class="relative my-7">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200"></div>
</div>
</div>
<!-- SNS 간편 로그인 버튼 그리드 -->
<div class="grid grid-cols-3 gap-3">
<!-- 카카오 로그인 -->
<!-- 네이버 로그인 -->
<!-- 구글 로그인 -->
</div>
<!-- 회원가입 안내 -->
<div class="text-center mt-7">
  <p class="text-xs text-slate-500 font-medium">
    아직 세이프티 회원이 아니신가요?
    <a href="#signup" class="ml-1 font-bold safety-text hover:underline transition-all">
      회원가입하기
    </a>
  </p>
</div>
<!-- 안심 시민 보증 안내 배지 -->
</main>
<!-- 하단 내비게이션 바 (메인 홈화면 완벽 일치: 홈 플로팅 원형 버튼 + 4대 메뉴) -->
<nav class="fixed bottom-0 w-full bg-white border-t border-slate-100 py-2 px-6 flex items-center justify-between z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
<!-- 1. 홈 (메인 홈화면 스타일: 시그니처 그린 원형 플로팅 활성 버튼) -->
<button class="flex flex-col items-center gap-1 group relative">
<div class="w-11 h-11 rounded-full safety-gradient flex items-center justify-center text-white shadow-md shadow-[#60c219]/35 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl font-bold">home</span>
</div>
<span class="text-[10px] font-bold safety-text">홈</span>
</button>
<!-- 2. 안전지도 -->
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group">
<div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
<span class="material-symbols-outlined text-2xl">map</span>
</div>
<span class="text-[10px] font-semibold text-slate-500">안전지도</span>
</button>
<!-- 3. 10초제보 (세션 42/43 결정: 원형 제거된 깔끔한 카메라 아이콘) -->
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group">
<div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
<span class="material-symbols-outlined text-2xl">photo_camera</span>
</div>
<span class="text-[10px] font-semibold text-slate-500">10초제보</span>
</button>
<!-- 4. 마이 -->
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group">
<div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
<span class="material-symbols-outlined text-2xl">person</span>
</div>
<span class="text-[10px] font-semibold text-slate-500">마이</span>
</button>
</nav>
</div>
</body></html>
