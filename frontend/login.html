<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>로그인 - 세이프티</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-fixed-dim": "#80d5cb",
            "on-primary-fixed": "#00201d",
            "on-tertiary-container": "#dbecff",
            "secondary": "#006c49",
            "surface-container-lowest": "#ffffff",
            "tertiary": "#005683",
            "on-error-container": "#93000a",
            "outline": "#6e7977",
            "secondary-container": "#6cf8bb",
            "primary-container": "#0f766e",
            "on-secondary": "#ffffff",
            "on-primary-container": "#a3faef",
            "on-primary-fixed-variant": "#00504a",
            "on-secondary-container": "#00714d",
            "error": "#ba1a1a",
            "on-tertiary-fixed-variant": "#004b73",
            "background": "#f9f9ff",
            "tertiary-container": "#006fa8",
            "surface-container-highest": "#dce2f7",
            "on-background": "#141b2b",
            "inverse-primary": "#80d5cb",
            "surface-bright": "#f9f9ff",
            "inverse-surface": "#293040",
            "on-primary": "#ffffff",
            "surface-variant": "#dce2f7",
            "on-secondary-fixed": "#002113",
            "surface-dim": "#d3daef",
            "surface-container-high": "#e1e8fd",
            "surface-tint": "#006a63",
            "surface-container": "#e9edff",
            "primary-fixed": "#9cf2e8",
            "tertiary-fixed": "#cce5ff",
            "secondary-fixed-dim": "#4edea3",
            "on-surface": "#141b2b",
            "tertiary-fixed-dim": "#93ccff",
            "surface-container-low": "#f1f3ff",
            "error-container": "#ffdad6",
            "on-surface-variant": "#3e4947",
            "primary": "#005c55",
            "on-secondary-fixed-variant": "#005236",
            "surface": "#f9f9ff",
            "inverse-on-surface": "#edf0ff",
            "on-tertiary-fixed": "#001d31",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "outline-variant": "#bdc9c6",
            "secondary-fixed": "#6ffbbe"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: {
            "space-sm": "0.75rem", "space-xs": "0.5rem", "space-xxs": "0.25rem",
            "space-lg": "1.5rem", "gutter-mobile": "1rem", "gutter-desktop": "1.5rem",
            "container-max": "1200px", "space-3xl": "4.5rem", "space-md": "1rem",
            "space-2xl": "3rem", "space-xl": "2rem"
          },
          fontFamily: {
            "body-lg": ["Plus Jakarta Sans"], "title-sm": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"],
            "headline-xl-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }],
            "title-sm": ["16px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }],
            "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "600" }],
            "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.04em", fontWeight: "700" }],
            "headline-xl-mobile": ["24px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "700" }],

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { width: 100%; margin: 0; padding: 0; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .safety-gradient {
      background: linear-gradient(135deg, #60c219 0%, #4fa912 100%);
    }
    .safety-text {
      color: #55b214;
    }
    .safety-border {
      border-color: #60c219;
    }
    body.page-transition { opacity: 0; transition: opacity 0.22s ease; }
    body.page-transition.page-loaded { opacity: 1; }
  </style>
</head>
<body class="text-slate-900 flex min-h-screen bg-white page-transition">
  <div class="w-full bg-white min-h-screen flex flex-col relative pb-28">
    
    <!-- 상단 헤더 (우측 요소 제거됨) -->
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,0,0,0.04)]">
      <div class="relative h-16 px-gutter-mobile flex items-center justify-between gap-space-xs">
        <!-- 왼쪽: 로고 이미지 + 로고 텍스트 -->
        <div class="flex items-center gap-2">
          <img src="../img/safety_logo_image.png" alt="안전디딤돌 로고" class="h-12 w-auto object-contain">
          <img src="../img/safety_logo_text.png" alt="안전디딤돌 로고 텍스트" class="h-6 w-auto object-contain">
        </div>
      </div>
    </header>

    <!-- 메인 본문: 세이프티 로그인 폼 -->
    <main class="flex-1 px-5 pt-24 flex flex-col justify-center">
      <!-- 서비스 브랜딩 & 환영 헤더 -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-28 rounded-2xl bg-gradient-to-br mb-2">
          <img src="../img/safety_logo_text.png" alt="세이프티 로고 아이콘" class="h-auto w-28 object-contain" />
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1.5">
          더 안전한 일상으로 위하여
        </h1>
        <p class="text-xs text-slate-500 font-medium leading-relaxed">
          원활한 서비스를 위해 로그인 후 이용해주세요
        </p>
      </div>

      <!-- 로그인 입력 폼 -->
      <form class="space-y-4" id="login-form">
        <!-- 아이디 / 이메일 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">아이디 또는 이메일</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg pointer-events-none">mail</span>
            <input class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#60c219] focus:bg-white focus:ring-2 focus:ring-[#60c219]/20 transition-all" id="login-email" placeholder="example@safety.kr" type="text"/>
          </div>
        </div>

        <!-- 비밀번호 입력 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-bold text-slate-700">비밀번호</label>
          </div>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg pointer-events-none">lock</span>
            <input class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#60c219] focus:bg-white focus:ring-2 focus:ring-[#60c219]/20 transition-all" id="login-password" placeholder="8자리 이상 영문, 숫자, 특수문자" type="password"/>
            <button aria-label="비밀번호 보기" id="login-password-toggle" class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
              <span class="material-symbols-outlined text-lg" id="login-password-toggle-icon">visibility</span>
            </button>
          </div>
        </div>

        <!-- 자동 로그인 및 아이디 저장 체크박스 -->
        <div class="flex items-center justify-between py-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input checked="" class="w-4 h-4 rounded border-slate-300 text-[#60c219] focus:ring-[#60c219] focus:ring-offset-0" type="checkbox"/>
            <span class="text-xs font-medium text-slate-600">로그인 상태 유지</span>
          </label>
        </div>

        <!-- 로그인 오류 메시지 -->
        <p class="hidden text-xs font-semibold text-rose-500 text-center" id="login-error"></p>

        <!-- 로그인 메인 CTA 버튼 -->
        <button class="w-full py-3.5 safety-gradient text-white rounded-xl font-bold text-sm shadow-md shadow-[#60c219]/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2" id="login-submit" type="submit">
          <span>로그인</span>
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </button>
      </form>

      <!-- 간편 소셜 로그인 구분선 -->
      <div class="relative my-7">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
      </div>

      <!-- SNS 간편 로그인 버튼 그리드 -->
      <div class="grid grid-cols-3 gap-3">
        <!-- 카카오, 네이버, 구글 버튼 위치 -->
      </div>

      <!-- 회원가입 안내 -->
      <div class="text-center mt-7">
        <p class="text-xs text-slate-500 font-medium">
          아직 세이프티 회원이 아니신가요?
          <a href="newmembership.html" class="ml-1 font-bold safety-text hover:underline transition-all">
            회원가입하기
          </a>
        </p>
      </div>
    </main>

    <!-- 하단 내비게이션 바 -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-100 py-2 px-6 flex items-center justify-between z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
      <!-- 1. 10초제보 -> 10report.html -->
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group" onclick="location.href='10report.html'">
        <div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
          <span class="material-symbols-outlined text-2xl">photo_camera</span>
        </div>
        <span class="text-[10px] font-semibold text-slate-500">10초제보</span>
      </button>

      <!-- 2. 안전지도 -> safymap.html -->
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group" onclick="location.href='safymap.html'">
        <div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
          <span class="material-symbols-outlined text-2xl">map</span>
        </div>
        <span class="text-[10px] font-semibold text-slate-500">안전지도</span>
      </button>

      <!-- 3. 홈 -> mainhome.html -->
      <button class="flex flex-col items-center gap-1 group relative" onclick="location.href='mainhome.html'">
        <div class="w-11 h-11 rounded-full safety-gradient flex items-center justify-center text-white shadow-md shadow-[#60c219]/35 group-active:scale-95 transition-transform">
          <span class="material-symbols-outlined text-2xl font-bold">home</span>
        </div>
        <span class="text-[10px] font-bold safety-text">홈</span>
      </button>

      <!-- 4. 커뮤니티 -> community.html -->
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group" onclick="location.href='community.html'">
        <div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
          <span class="material-symbols-outlined text-2xl">group</span>
        </div>
        <span class="text-[10px] font-semibold text-slate-500">커뮤니티</span>
      </button>

      <!-- 5. 마이 -> mypage.html -->
      <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition-colors group" onclick="location.href='mypage.html'">
        <div class="w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-slate-50">
          <span class="material-symbols-outlined text-2xl">person</span>
        </div>
        <span class="text-[10px] font-semibold text-slate-500">마이</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../backend/data/supabaseClient.js"></script>
  <script src="../backend/user_login.js"></script>

  <script>
    // 비밀번호 보기/숨기기 토글
    (function() {
      const pwInput = document.getElementById('login-password');
      const toggleBtn = document.getElementById('login-password-toggle');
      const toggleIcon = document.getElementById('login-password-toggle-icon');
      if (!pwInput || !toggleBtn || !toggleIcon) return;

      toggleBtn.addEventListener('click', function() {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        toggleIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isHidden ? '비밀번호 숨기기' : '비밀번호 보기');
      });
    })();

    requestAnimationFrame(() => document.body.classList.add('page-loaded'));
    document.querySelectorAll('a[href]').forEach(function (link) {
      var href = link.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
      link.addEventListener('click', function (e) {
        e.preventDefault();
        document.body.classList.remove('page-loaded');
        setTimeout(function () { window.location.href = href; }, 200);
      });
    });
  </script>
</body>
</html>
