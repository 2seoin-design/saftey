<div id="login-toast" class="fixed left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-full bg-[#1E293B]/90 text-white font-label-md text-label-md font-bold shadow-lg backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300" style="bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));">
  로그인 후 이용해주세요
</div>

<script>
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(8);
      }
    });
  });

  // 로그인이 필요한 버튼/탭: 비로그인 상태에서는 이동을 막고 토스트만 표시
  // (이 페이지 자체는 맨 위 스크립트가 비로그인 시 즉시 login.html로 보내지만,
  //  뒤로가기 캐시 등 예외 상황에 대비해 각 버튼에도 동일한 가드를 걸어둠)
  const isLoggedIn = !!localStorage.getItem('sb-gaicuiithjllwillleyo-auth-token');
  const loginToast = document.getElementById('login-toast');
  let loginToastTimer = null;
  function showLoginToast() {
    loginToast.classList.remove('opacity-0');
    loginToast.classList.add('opacity-100');
    clearTimeout(loginToastTimer);
    loginToastTimer = setTimeout(() => {
      loginToast.classList.remove('opacity-100');
      loginToast.classList.add('opacity-0');
    }, 2000);
  }

  // 페이지 전환 시 자연스러운 페이드 효과
  requestAnimationFrame(() => document.body.classList.add('page-loaded'));

  function navigateTo(href) {
    document.body.classList.remove('page-loaded');
    setTimeout(() => { window.location.href = href; }, 200);
  }

  // <a href="...">와 <button data-href="...">를 동일한 방식으로 처리
  document.querySelectorAll('a[href], [data-href]').forEach(el => {
    const href = el.getAttribute('href') || el.getAttribute('data-href');
    if (!href || href.startsWith('#') || href.startsWith('http') || el.target === '_blank') return;
    el.addEventListener('click', (e) => {
      e.preventDefault();
      if (el.hasAttribute('data-auth-required') && !isLoggedIn) {
        showLoginToast();
        return;
      }
      navigateTo(href);
    });
  });
</script>
