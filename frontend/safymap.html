      <!-- TMAP SDK (route_map.html과 동일한 appKey 사용) -->
      <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&amp;appKey=7ZJRT0iNxB42myqIjhvAS66OZKrm0SWE9H4UVe5Y"></script>

      <!-- 실제 지도 초기화 -->
      <script>
        (function() {
          const HYEHWA_STATION = { lat: 37.5822, lng: 127.0019 };
          const TMAP_APP_KEY = '7ZJRT0iNxB42myqIjhvAS66OZKrm0SWE9H4UVe5Y';
          const mapDiv = document.getElementById('safymap_div');
          const currentLabel = document.getElementById('safymap-current-label');
          if (!mapDiv || typeof Tmapv2 === 'undefined') return;

          const map = new Tmapv2.Map(mapDiv.id, {
            center: new Tmapv2.LatLng(HYEHWA_STATION.lat, HYEHWA_STATION.lng),
            width: '100%',
            height: '100%',
            zoom: 16,
          });

          let currentMarker = new Tmapv2.Marker({
            position: new Tmapv2.LatLng(HYEHWA_STATION.lat, HYEHWA_STATION.lng),
            map: map,
            title: '현재 위치 (혜화역)',
          });
          let lastKnownPosition = null; // { lat, lng } - watchPosition으로 추적된 가장 최근 위치

          // ---- 실시간 위험 제보 마커 (route_map.html과 동일한 방식) ----
          const REPORT_REFRESH_RADIUS_M = 1500;
          const reportTypeIcons = { CONSTR: '🚧', HAZARD: '⚠️', STAIRS: '🪜', SAFE: '✅' };
          let reportMarkers = [];

          import('../backend/data/supabaseService.js').then(({ fetchNearbyReports, subscribeToRealtimeReports }) => {
            async function refreshReportMarkers() {
              const center = map.getCenter();
              const reports = await fetchNearbyReports(center.lat(), center.lng(), REPORT_REFRESH_RADIUS_M);
              reportMarkers.forEach((m) => m.setMap(null));
              reportMarkers = reports.map((r) => new Tmapv2.Marker({
                position: new Tmapv2.LatLng(r.lat, r.lng),
                map,
                title: `${reportTypeIcons[r.report_type] ?? '❗'} ${r.description || r.report_type}`,
              }));
            }

            refreshReportMarkers();
            subscribeToRealtimeReports(() => refreshReportMarkers());
          }).catch((err) => console.error('[safymap] 제보 마커 로딩 실패:', err));

          // 좌표 -> 실제 주소 문자열로 변환 (TMAP 역지오코딩)
          // addressType=A10은 지번주소+도로명주소를 함께 반환해 주소가 두 개처럼 보이므로,
          // 도로명주소 하나만 나오는 A02를 사용함
          async function reverseGeocode(lat, lng) {
            const url = `https://apis.openapi.sk.com/tmap/geo/reversegeocoding?version=1&lat=${lat}&lon=${lng}&coordType=WGS84GEO&addressType=A02&appKey=${TMAP_APP_KEY}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('역지오코딩 실패');
            const data = await res.json();
            return data?.addressInfo?.fullAddress || null;
          }

          function updateCurrentPosition(lat, lng) {
            lastKnownPosition = { lat, lng };
            const here = new Tmapv2.LatLng(lat, lng);
            map.setCenter(here);
            currentMarker.setMap(null);
            currentMarker = new Tmapv2.Marker({ position: here, map: map, title: '현재 위치' });

            if (currentLabel) {
              currentLabel.textContent = '내 위치 확인 중...';
              reverseGeocode(lat, lng)
                .then((address) => { if (currentLabel) currentLabel.textContent = address || '현재 위치'; })
                .catch(() => { if (currentLabel) currentLabel.textContent = '현재 위치'; });
            }
          }

          // 위치 권한이 허용되면 실제 현재 위치를 지속적으로 추적하여 지도 중심/마커/라벨을 갱신
          if (!window.isSecureContext) {
            // Geolocation API는 보안 컨텍스트(https 또는 localhost)에서만 동작함.
            // file://로 직접 연 경우 대부분의 브라우저가 즉시 권한을 거부함.
            console.warn('[safymap] Geolocation requires a secure context. 현재 origin:', location.href);
            if (currentLabel) currentLabel.textContent = '현재 위치 (혜화역) · 위치 추적은 http(localhost) 또는 https 환경에서만 동작해요';
          } else if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
              (pos) => updateCurrentPosition(pos.coords.latitude, pos.coords.longitude),
              (err) => {
                console.error('[safymap] Geolocation error:', err.code, err.message);
                const reasons = {
                  1: '위치 권한이 거부되었어요',
                  2: '위치 정보를 가져올 수 없어요',
                  3: '위치 요청이 시간 초과됐어요',
                };
                if (currentLabel) currentLabel.textContent = `현재 위치 (혜화역) · ${reasons[err.code] || '위치를 가져오지 못했어요'}`;
              },
              { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
          } else {
            if (currentLabel) currentLabel.textContent = '현재 위치 (혜화역) · 이 브라우저는 위치 정보를 지원하지 않아요';
          }

          // ---- 출발지/도착지 검색 (주소/장소명) -> 결과 리스트 표시 -> 선택 시 지도에 마커 표시 ----
          async function searchPois(keyword) {
            const url = `https://apis.openapi.sk.com/tmap/pois?version=1&searchKeyword=${encodeURIComponent(keyword)}&resCoordType=WGS84GEO&reqCoordType=WGS84GEO&count=8&page=1&appKey=${TMAP_APP_KEY}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('장소 검색 실패');
            const data = await res.json();
            return data?.searchPoiInfo?.pois?.poi || [];
          }

          function setupPoiSearch(inputEl, resultsEl, markerTitlePrefix) {
            if (!inputEl) return null;
            let marker = null;
            let timer = null;
            let token = 0;
            let selectedLocation = null; // { lat, lng } - 길찾기에 쓸 실제 좌표

            function hideResults() {
              if (!resultsEl) return;
              resultsEl.classList.add('hidden');
              resultsEl.innerHTML = '';
            }

            function setLocation(lat, lng, label) {
              if (Number.isNaN(lat) || Number.isNaN(lng)) return;

              inputEl.value = label || '';
              hideResults();
              selectedLocation = { lat, lng };

              const pos = new Tmapv2.LatLng(lat, lng);
              if (marker) marker.setMap(null);
              marker = new Tmapv2.Marker({ position: pos, map: map, title: `${markerTitlePrefix}: ${label || ''}` });
              map.setCenter(pos); // 지도에 실시간 반영
            }

            function getLocation() {
              return selectedLocation;
            }

            function selectPoi(poi) {
              const lat = parseFloat(poi.noorLat || poi.frontLat);
              const lng = parseFloat(poi.noorLon || poi.frontLon);
              setLocation(lat, lng, poi.name || '');
            }

            function renderResults(pois) {
              if (!resultsEl) return;
              if (!pois.length) {
                resultsEl.innerHTML = '<li class="px-3 py-2.5 text-[12px] text-on-surface-variant">검색 결과가 없어요</li>';
                resultsEl.classList.remove('hidden');
                return;
              }
              resultsEl.innerHTML = pois.map((poi) => {
                const address = [poi.upperAddrName, poi.middleAddrName, poi.lowerAddrName, poi.roadName].filter(Boolean).join(' ');
                return `<li class="px-3 py-2.5 border-b border-outline-variant/20 last:border-b-0 cursor-pointer hover:bg-surface-container-low">
                  <div class="text-[13px] font-bold text-on-surface truncate">${poi.name || ''}</div>
                  <div class="text-[11px] text-on-surface-variant truncate">${address}</div>
                </li>`;
              }).join('');
              resultsEl.classList.remove('hidden');
              Array.from(resultsEl.children).forEach((li, i) => {
                li.addEventListener('click', () => selectPoi(pois[i]));
              });
            }

            async function runSearch(keyword) {
              const myToken = ++token;
              try {
                const pois = await searchPois(keyword);
                if (myToken !== token) return; // 더 최신 검색이 있으면 이전 응답은 버림
                renderResults(pois);
              } catch (err) {
                console.error('[safymap] POI search error:', err);
              }
            }

            inputEl.addEventListener('input', () => {
              const keyword = inputEl.value.trim();
              clearTimeout(timer);
              if (!keyword) { hideResults(); return; }
              timer = setTimeout(() => runSearch(keyword), 300);
            });

            document.addEventListener('click', (e) => {
              if (inputEl.contains(e.target) || (resultsEl && resultsEl.contains(e.target))) return;
              hideResults();
            });

            function searchNow() {
              const keyword = inputEl.value.trim();
              clearTimeout(timer);
              if (!keyword) { hideResults(); return; }
              runSearch(keyword);
            }

            return { setLocation, searchNow, getLocation };
          }

          const startPoiSearch = setupPoiSearch(document.getElementById('safymap-start-input'), document.getElementById('safymap-start-results'), '출발');
          const destPoiSearch = setupPoiSearch(document.getElementById('safymap-dest-input'), document.getElementById('safymap-dest-results'), '도착');

          // ---- 출발지/도착지 검색(돋보기) 버튼: 클릭 시 즉시 검색 실행 (입력만으로도 자동 검색되지만, 눌러도 동작함) ----
          const startSearchBtn = document.getElementById('safymap-start-search-btn');
          if (startSearchBtn && startPoiSearch) {
            startSearchBtn.addEventListener('click', () => startPoiSearch.searchNow());
          }
          const destSearchBtn = document.getElementById('safymap-dest-search-btn');
          if (destSearchBtn && destPoiSearch) {
            destSearchBtn.addEventListener('click', () => destPoiSearch.searchNow());
          }

          // ---- 출발지의 '현재 위치로 설정' 버튼 ----
          const startMyLocationBtn = document.getElementById('safymap-start-mylocation-btn');
          if (startMyLocationBtn && startPoiSearch) {
            startMyLocationBtn.addEventListener('click', () => {
              function applyAsStart(lat, lng) {
                startPoiSearch.setLocation(lat, lng, '현재 위치 확인 중...');
                reverseGeocode(lat, lng)
                  .then((address) => startPoiSearch.setLocation(lat, lng, address || '현재 위치'))
                  .catch(() => startPoiSearch.setLocation(lat, lng, '현재 위치'));
              }

              if (lastKnownPosition) {
                applyAsStart(lastKnownPosition.lat, lastKnownPosition.lng);
                return;
              }
              if (!navigator.geolocation) return;
              navigator.geolocation.getCurrentPosition(
                (pos) => applyAsStart(pos.coords.latitude, pos.coords.longitude),
                () => alert('현재 위치를 가져오지 못했어요. 위치 권한을 확인해주세요.')
              );
            });
          }

          // 다른 <script> 블록(안심 귀갓길 버튼 핸들러)에서 지도/검색 결과 좌표를 쓸 수 있도록 노출
          window.__safymap = { map, startPoiSearch, destPoiSearch };
        })();
      </script>

      <!-- Interaction Scripts -->
      <script>
        document.addEventListener('DOMContentLoaded', function() {
          const navBtn = document.getElementById('start-nav-btn');
          const barrierFreeBtn = document.getElementById('start-barrier-free-btn');

          if (navBtn) {
            navBtn.addEventListener('click', async function() {
              const startValue = document.getElementById('safymap-start-input')?.value.trim();
              const destValue = document.getElementById('safymap-dest-input')?.value.trim();
              if (!startValue || !destValue) {
                window.showSafymapToast('출발지 및 도착지를 설정해주세요.');
                return;
              }

              const ctx = window.__safymap;
              const start = ctx?.startPoiSearch?.getLocation();
              const dest = ctx?.destPoiSearch?.getLocation();
              if (!start || !dest) {
                window.showSafymapToast('검색 결과 목록에서 출발지/도착지를 선택해주세요.');
                return;
              }

              navBtn.disabled = true;
              window.showSafymapToast('안심 경로를 찾는 중...');
              try {
                const { findSafeRoute } = await import('../backend/data/routeService.js');
                const { normalRoute, safeRoute } = await findSafeRoute({
                  startLat: start.lat,
                  startLng: start.lng,
                  endLat: dest.lat,
                  endLng: dest.lng,
                });

                if (window.__safymapNormalLine) window.__safymapNormalLine.setMap(null);
                if (window.__safymapSafeLine) window.__safymapSafeLine.setMap(null);

                window.__safymapNormalLine = new Tmapv2.Polyline({
                  path: normalRoute.coords.map((c) => new Tmapv2.LatLng(c.lat, c.lng)),
                  strokeColor: '#2563eb',
                  strokeWeight: 6,
                  map: ctx.map,
                });
                window.__safymapSafeLine = new Tmapv2.Polyline({
                  path: safeRoute.coords.map((c) => new Tmapv2.LatLng(c.lat, c.lng)),
                  strokeColor: '#16a34a',
                  strokeWeight: 6,
                  map: ctx.map,
                });

                ctx.map.setCenter(new Tmapv2.LatLng(start.lat, start.lng));
                window.showSafymapToast(
                  `안심 경로 안심점수 ${safeRoute.score}` + (safeRoute.blocked ? ' · 경로상 위험제보 있음' : '')
                );
              } catch (err) {
                console.error('[safymap] 경로 탐색 실패:', err);
                window.showSafymapToast('경로를 찾지 못했어요: ' + err.message);
              } finally {
                navBtn.disabled = false;
              }
            });
          }

          if (barrierFreeBtn) {
            barrierFreeBtn.addEventListener('click', function() {
              window.location.href = 'walking_line.html';
            });
          }

          // 길안내 CTA 바: 나타날 땐 아래에서 위로 슬라이드 업, 사라질 땐 아래로 슬라이드 다운
          const ctaBar = document.getElementById('route-cta-bar');
          const ctaSpacer = document.getElementById('route-cta-spacer');
          let ctaVisible = false;

          function applyCtaVisibility() {
            if (!ctaBar) return;
            if (ctaVisible) {
              ctaBar.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
              ctaBar.classList.add('translate-y-0', 'opacity-100');
            } else {
              ctaBar.classList.remove('translate-y-0', 'opacity-100');
              ctaBar.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            }
            // 실제 콘텐츠 높이만큼 스페이서를 확보 (transform은 레이아웃 높이에 영향을 주지 않으므로
            // 숨김 상태일 땐 0으로 직접 맞춰줌)
            if (ctaSpacer) ctaSpacer.style.height = ctaVisible ? ctaBar.offsetHeight + 'px' : '0px';
          }
          applyCtaVisibility();
          window.addEventListener('resize', applyCtaVisibility);
          if (window.ResizeObserver && ctaBar) {
            new ResizeObserver(applyCtaVisibility).observe(ctaBar);
          }

          // 하단 내비게이션의 '안전지도' 버튼: 누를 때마다 길안내 CTA 바를 보였다 숨겼다 함
          const ctaToggleBtn = document.getElementById('safymap-cta-toggle');
          if (ctaToggleBtn && ctaBar) {
            ctaToggleBtn.addEventListener('click', function() {
              ctaVisible = !ctaVisible;
              ctaToggleBtn.setAttribute('aria-pressed', String(ctaVisible));
              applyCtaVisibility();
            });
          }

          // 다른 페이지들과 동일한 페이드 전환: 클릭 즉시 이동하지 않고 살짝 기다렸다가 이동
          requestAnimationFrame(() => document.body.classList.add('page-loaded'));
          document.querySelectorAll('a[href]').forEach(function(link) {
            var href = link.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
            link.addEventListener('click', function(e) {
              e.preventDefault();
              document.body.classList.remove('page-loaded');
              setTimeout(function() {
                window.location.href = href;
              }, 200);
            });
          });
        });
      </script>

    </div>
  </main>

  <!-- 안내 토스트 (출발/도착지 미입력 등 공용 안내) -->
  <div id="safymap-toast" class="fixed left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-full bg-[#1E293B]/90 text-white font-label-md text-label-md font-bold shadow-lg backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300" style="bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));"></div>

  <script>
    (function() {
      const toast = document.getElementById('safymap-toast');
      let toastTimer = null;
      window.showSafymapToast = function(message) {
        if (!toast) return;
        toast.textContent = message;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 2000);
      };
    })();
  </script>
