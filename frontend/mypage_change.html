<script>
  requestAnimationFrame(() => document.body.classList.add('page-loaded'));
  document.querySelectorAll('a[href]').forEach((link) => {
    const href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('http') || link.target === '_blank') return;
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.remove('page-loaded');
      setTimeout(() => { window.location.href = href; }, 200);
    });
  });

  const nameInput = document.getElementById('profile-name-input');
  const preview = document.getElementById('profile-preview');
  const previewIcon = document.getElementById('profile-preview-icon');
  const upload = document.getElementById('profile-upload');
  const form = document.getElementById('profile-edit-form');
  const submitBtn = document.getElementById('profile-edit-submit');
  const messageEl = document.getElementById('profile-edit-message');

  let pendingAvatarDataUrl = null;

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? '#ba1a1a' : 'rgb(79, 169, 18)';
  }

  // 사진이 있으면 이미지를, 없으면 기본 프로필 아이콘을 보여줌
  function showAvatarImage(src) {
    preview.src = src;
    preview.classList.remove('hidden');
    previewIcon.classList.add('hidden');
  }

  // 현재 사용자 정보 불러와 폼에 채우기
  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) {
      location.href = 'login.html';
      return;
    }
    nameInput.value = user.user_metadata?.name || '';
    if (user.user_metadata?.avatar_url) {
      showAvatarImage(user.user_metadata.avatar_url);
    }
  });

  // 사진 선택 시 미리보기 + 저장용 데이터 준비
  upload.addEventListener('change', () => {
    const file = upload.files[0];
    if (!file) return;
    showAvatarImage(URL.createObjectURL(file));

    const reader = new FileReader();
    reader.onload = () => { pendingAvatarDataUrl = reader.result; };
    reader.readAsDataURL(file);
  });

  // 저장
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) {
      showMessage('이름을 입력해주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-60');
    showMessage('저장 중...', false);

    const updateData = { name };
    if (pendingAvatarDataUrl) {
      updateData.avatar_url = pendingAvatarDataUrl;
    }

    const { error } = await sb.auth.updateUser({ data: updateData });

    submitBtn.disabled = false;
    submitBtn.classList.remove('opacity-60');

    if (error) {
      showMessage('저장에 실패했습니다: ' + error.message, true);
      return;
    }

    showMessage('프로필이 수정되었습니다.', false);
    setTimeout(() => { location.href = 'mypage.html'; }, 600);
  });
</script>
