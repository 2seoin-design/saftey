<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>프로필 수정 - 세이프티</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f9f9ff; }
    .safety-gradient { background: linear-gradient(135deg, rgb(96, 194, 25) 0%, rgb(79, 169, 18) 100%); }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-900">

  <!-- 상단 헤더 -->
  <header class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 h-14 flex items-center justify-between">
    <button onclick="history.back()" class="p-2 text-slate-700 hover:bg-slate-100 rounded-full transition-colors">
      <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-bold text-slate-900">프로필 및 정보 수정</h1>
    <div class="w-10"></div> <!-- 여백 맞춤용 -->
  </header>

  <!-- 메인 수정 폼 -->
  <main class="flex-1 pt-20 px-5 pb-10 max-w-md mx-auto w-full">
    <form onsubmit="event.preventDefault(); alert('프로필이 수정되었습니다.'); history.back();" class="space-y-6">
      
      <!-- 프로필 이미지 변경 -->
      <div class="flex flex-col items-center justify-center">
        <div class="relative">
          <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-[#60c219] p-0.5 bg-white shadow-md">
            <img id="profile-preview" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuuTAlHxbyVyWvDmZDfhRGAj49MVb0TL8TQ78TsKyLH2q1hIyRSXoMj4cUC4oSevxvoU3zH9Sp5QzTfTVPPbU63kZG5ja3xtyrVJvhPw4NJttjehDgc6xHj9l8XWk1WjKhVzdMDFcbc-o3nst7fe90AmuPAnvsxwhds8eCDtH-2tv-corPpxC6CPQ_VcSY5BTfHFmtu7rLEpGvwlO3lcc88OGyilg1x869Z_jzioIakvDN35dJgHwO9A" alt="프로필 이미지">
          </div>
          <label for="profile-upload" class="absolute bottom-0 right-0 w-8 h-8 safety-gradient text-white rounded-full flex items-center justify-center shadow-md cursor-pointer active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-sm">photo_camera</span>
          </label>
          <input id="profile-upload" type="file" accept="image/*" class="hidden" onchange="const f=this.files[0]; if(f){ document.getElementById('profile-preview').src = URL.createObjectURL(f); }">
        </div>
        <span class="text-xs text-slate-400 mt-2 font-medium">사진 변경 아이콘을 터치하세요</span>
      </div>

      <!-- 이름 / 닉네임 수정 -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">활동 닉네임 / 이름</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg">person</span>
          <input type="text" value="김지혜 파수꾼" required class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:outline-none focus:border-[#60c219] focus:ring-2 focus:ring-[#60c219]/20 transition-all">
        </div>
      </div>

      <!-- 활동 지역 설정 -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">주 활동 지역</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg">location_on</span>
          <input type="text" value="종로구 혜화동 1동" readonly class="w-full pl-10 pr-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium text-slate-500 cursor-not-allowed">
        </div>
      </div>

      <!-- 저장 버튼 -->
      <button type="submit" class="w-full py-3.5 safety-gradient text-white rounded-xl font-bold text-sm shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-1 mt-8">
        <span>수정 완료</span>
        <span class="material-symbols-outlined text-base">check</span>
      </button>
    </form>
  </main>

</body>
</html>
