<script>
  (function initCommunityPost() {
    // Top Bar Header Submit Button sync
    const headerBtn = document.getElementById('header-submit-btn');
    if (headerBtn) {
      headerBtn.classList.remove('bg-primary');
      headerBtn.style.background = 'linear-gradient(135deg, #69d00f 0%, #4fa912 100%)';
      headerBtn.textContent = '등록 (+200P)';
      headerBtn.onclick = function() {
        document.getElementById('safe-post-form').dispatchEvent(new Event('submit', { cancelable: true }));
      };
    }

    // Category Chip Selection Micro-interaction
    const chips = document.querySelectorAll('.category-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.dataset.active = "false";
          c.className = "category-chip flex-shrink-0 px-space-md py-space-xs rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-all flex items-center gap-1.5 active:scale-95 hover:bg-surface-variant";
        });
        chip.dataset.active = "true";
        chip.className = "category-chip flex-shrink-0 px-space-md py-space-xs rounded-full bg-gradient-to-r from-[#69d00f] to-[#4fa912] text-white font-label-md text-label-md font-bold shadow-[0_3px_10px_rgba(79,169,18,0.3)] transition-all flex items-center gap-1.5 active:scale-95";
      });
    });

    // Safety Badges Toggle Interaction
    const safetyTags = document.querySelectorAll('.safety-tag');
    safetyTags.forEach(tag => {
      const isSelected = tag.dataset.selected === "true";
      applyTagState(tag, isSelected);

      tag.addEventListener('click', () => {
        const currentlySelected = tag.dataset.selected === "true";
        applyTagState(tag, !currentlySelected);
      });
    });

    function applyTagState(tag, active) {
      tag.dataset.selected = active ? "true" : "false";
      const checkIcon = tag.querySelector('.tag-check');
      if (active) {
        tag.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        tag.classList.add('bg-secondary-container', 'text-on-secondary-container', 'font-bold');
        if (checkIcon) checkIcon.classList.remove('hidden');
      } else {
        tag.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'font-bold');
        tag.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        if (checkIcon) checkIcon.classList.add('hidden');
      }
    }

    // Live Title Counter
    const titleInput = document.getElementById('post-title');
    const titleCounter = document.getElementById('title-counter');
    if (titleInput && titleCounter) {
      titleInput.addEventListener('input', () => {
        titleCounter.textContent = `${titleInput.value.length}/40`;
        if (titleInput.value.length >= 35) {
          titleCounter.classList.add('text-secondary');
        } else {
          titleCounter.classList.remove('text-secondary');
        }
      });
    }

    // Live Content Counter
    const contentInput = document.getElementById('post-content');
    const contentCounter = document.getElementById('content-counter');
    if (contentInput && contentCounter) {
      contentInput.addEventListener('input', () => {
        contentCounter.textContent = `${contentInput.value.length}/1000`;
      });
    }

    // Submit handler with feedback
    const form = document.getElementById('safe-post-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const titleVal = titleInput ? titleInput.value.trim() : '';
        if (!titleVal) {
          titleInput.focus();
          titleInput.parentElement.classList.add('animate-bounce');
          setTimeout(() => titleInput.parentElement.classList.remove('animate-bounce'), 600);
          return;
        }

        // Delight Celebration Notification
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 px-space-lg py-space-sm rounded-full bg-on-surface text-surface shadow-2xl z-50 flex items-center gap-2 text-label-md animate-fade-in pointer-events-none';
        toast.innerHTML = '<span class="material-symbols-outlined text-[#69d00f]" style="font-variation-settings: \'FILL\' 1;">verified</span><span>안심 소식이 등록되었습니다! (+200P)</span>';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      });
    }
  })();
</script></main>
