  (function initCounters() {

    const titleCounter = document.getElementById('title-counter');
    if (titleInput && titleCounter) {
      titleInput.addEventListener('input', () => {
        titleCounter.textContent = `${titleInput.value.length}/40`;
        titleCounter.classList.toggle('text-secondary', titleInput.value.length >= 35);
      });
    }

    const contentInput = document.getElementById('post-content');
    const contentCounter = document.getElementById('content-counter');
    if (contentInput && contentCounter) {
      contentInput.addEventListener('input', () => {
        contentCounter.textContent = `${contentInput.value.length}/1000`;
      });
    }
  })();
</script>

<!-- 실제 게시글 작성/수정 로직 -->
<script type="module">
  import { supabase } from '../backend/data/supabaseService.js';
  import { createPost, updatePost, fetchPost, uploadPostImage } from '../backend/data/communityService.js';

  const form = document.getElementById('safe-post-form');
  const titleInput = document.getElementById('post-title');
  const contentInput = document.getElementById('post-content');
  const photoInput = document.getElementById('photoInput');
  const photoPreviewSlot = document.getElementById('photoPreviewSlot');
  const photoPreviewImg = document.getElementById('photoPreviewImg');
  const btnRemovePhoto = document.getElementById('btnRemovePhoto');
  const submitBtn = form.querySelector('button[type="submit"]');
  const submitBtnLabel = document.getElementById('submitBtnLabel');
  const formError = document.getElementById('formError');
  const pageTitle = document.getElementById('pageTitle');

  const postId = new URLSearchParams(location.search).get('id');
  let selectedFile = null;
  let existingImageUrl = null;
  let currentUser = null;

  function showPreview(url) {
    photoPreviewImg.src = url;
    photoPreviewSlot.classList.remove('hidden');
  }

  photoInput.addEventListener('change', () => {
    const file = photoInput.files?.[0];
    if (!file) return;
    selectedFile = file;
    showPreview(URL.createObjectURL(file));
  });

  btnRemovePhoto.addEventListener('click', () => {
    selectedFile = null;
    existingImageUrl = null;
    photoInput.value = '';
    photoPreviewSlot.classList.add('hidden');
  });

  function showError(message) {
    formError.textContent = message;
    formError.classList.remove('hidden');
  }

  const {
    data: { user },
  } = await supabase.auth.getUser();
  currentUser = user;

  if (postId) {
    pageTitle.textContent = '안심 글 수정';
    submitBtnLabel.textContent = '수정하기';
    try {
      const post = await fetchPost(postId);
      if (!currentUser || post.author_id !== currentUser.id) {
        alert('본인이 작성한 글만 수정할 수 있습니다.');
        location.href = 'community.html';
      } else {
        titleInput.value = post.title;
        titleInput.dispatchEvent(new Event('input'));
        contentInput.value = post.content;
        contentInput.dispatchEvent(new Event('input'));
        if (post.image_url) {
          existingImageUrl = post.image_url;
          showPreview(post.image_url);
        }
      }
    } catch (err) {
      showError('게시글을 불러오지 못했습니다: ' + err.message);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.add('hidden');

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    if (!title || !content) {
      titleInput.parentElement.classList.add('animate-bounce');
      setTimeout(() => titleInput.parentElement.classList.remove('animate-bounce'), 600);
      showError('제목과 내용을 모두 입력해주세요.');
      return;
    }
    if (!currentUser) {
      showError('로그인이 필요합니다.');
      return;
    }

    submitBtn.disabled = true;
    try {
      let imageUrl = existingImageUrl;
      if (selectedFile) {
        imageUrl = await uploadPostImage(selectedFile, currentUser.id);
      }

      if (postId) {
        await updatePost(postId, { title, content, imageUrl });
      } else {
        await createPost({ title, content, imageUrl });
      }
      location.href = 'community.html';
    } catch (err) {
      showError('저장에 실패했습니다: ' + err.message);
      submitBtn.disabled = false;
    }
  });
</script></main>
